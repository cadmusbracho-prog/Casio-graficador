name: Compilar Add-in Casio

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar repositorio de Planete Casio y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget gpg curl
          # Agregar repositorio oficial de Planete Casio para Debian/Ubuntu
          wget -qO - https://apt.planet-casio.com/pubkey.gpg | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/planet-casio.gpg
          echo "deb https://apt.planet-casio.com/ubuntu jammy main" | sudo tee /etc/apt/sources.list.d/planet-casio.list
          sudo apt-get update || true
          # Instalar toolchain sh-elf y herramientas fxsdk
          sudo apt-get install -y --allow-unauthenticated fxsdk sh-elf-gcc gint || true

      - name: Compilar Add-in
        run: |
          fxsdk build-fx --verbose

      - name: Subir binario compilado
        uses: actions/upload-artifact@v4
        with:
          name: casio-addin-fx9860g
          path: |
            build*/*.g1a
            build*/*.g3a
