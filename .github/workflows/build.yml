name: Compilar Add-in Casio

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libarchive-dev pkg-config libgmp-dev libmpfr-dev libmpc-dev texinfo curl

      - name: Instalar fxSDK y toolchain SH
        run: |
          # Descargamos el script o instalador oficial de fxsdk vía pip/cargo o repositorio directo
          pip3 install --upgrade pip
          # Compilación manual o instalación limpia de fxsdk
          git clone https://gitlab.com/Lephenixnoir/fxsdk.git
          cd fxsdk
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          sudo make install

      - name: Configurar y compilar proyecto
        run: |
          fxsdk build-fx

      - name: Subir binario compilado
        uses: actions/upload-artifact@v4
        with:
          name: casio-addin-fx9860g
          path: |
            build-fx/*.g1a
            build-fx/*.g3a
