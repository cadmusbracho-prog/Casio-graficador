name: Compilar Add-in Casio

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar repositorios y toolchain Casio
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip libpng-dev libusb-1.0-0-dev
          # Descargar el toolchain sh-elf precompilado oficial
          wget https://bintray.com/artifact/download/lephenixnoir/sh-elf/sh-elf-gcc-latest.tar.gz || true
          # Instalar fxsdk directamente desde PyPI oficial
          pip3 install fxsdk || pip3 install --break-system-packages fxsdk

      - name: Compilar Add-in
        run: |
          fxsdk build-fx --verbose

      - name: Subir binario compilado
        uses: actions/upload-artifact@v4
        with:
          name: casio-addin-fx9860g
          path: |
            build*/*.g1a
            build*/*.g3a
            *.g1a
